name: ZJU-OCCS
channels:
  - conda-forge
channel_priority: strict

dependencies:
  - python=3.10
  - pip

  # ---- Front-end toolchain ----
  - nodejs>=20

  # ---- Core scientific stack ----
  - numpy
  - scipy
  - scikit-learn
  - scikit-optimize

  # ---- Plotting without Qt ----
  - matplotlib-base

  # ---- Web service ----
  - fastapi
  - uvicorn
  - python-multipart

  # ---- Dev / CI tools ----
  - pylint
  - pytest


  # ---- Install OCCS (editable) with FastAPI extras for the web service ----
  - pip:
      - -e .[web]
